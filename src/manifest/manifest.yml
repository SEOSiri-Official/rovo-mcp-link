modules:
  jira:adminPage:
    - key: seosiri-rovo-mcp-admin
      title: SEOSiri Rovo-MCP Link
      resource: main-ui
      render: native
  jira:issuePanel:
    - key: seosiri-rovo-mcp-panel
      title: SEOSiri MCP Context Gateway
      resource: main-ui
      render: native
      icon: https://developers.seosiri.com/favicon.svg
resources:
  - key: main-ui
    path: src/frontend/index.html
app:
  runtime:
    name: nodejs22.x
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - "rovomcp.seosiri.com"
        - "developers.seosiri.com"
        - "seosiri.com"
        - "*.seosiri.com"

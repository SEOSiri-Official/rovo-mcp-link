modules:
  jira:adminPage:
    - key: seosiri-rovo-mcp-admin
      title: SEOSiri Rovo-MCP Link
      resource: main-ui
      render: native
  jira:issuePanel:
    - key: seosiri-rovo-mcp-panel
      title: SEOSiri MCP Context Gateway
      resource: main-ui
      render: native
      icon: https://developers.seosiri.com/favicon.svg
resources:
  - key: main-ui
    path: src/frontend/index.jsx
  confluence:macro:
    - key: seosiri-confluence-architecture-macro
      title: SEOSiri MCP Architecture Embed
      description: Embed live SEOSiri Model Context Protocol tools and topology data inside Confluence.
      resource: confluence-ui
      render: native
resources:
  - key: confluence-ui
    path: src/confluence/macro.jsx

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/d3ec4edb-3426-4a53-bb3d-1f0650249ccd
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - address: rovomcp.seosiri.com
        - address: developers.seosiri.com
        - address: seosiri.com
        - address: "*.seosiri.com"

modules:
  jira:adminPage:
    - key: seosiri-rovo-mcp-admin
      title: SEOSiri Rovo-MCP Link
      resource: main-ui
      render: native
  jira:issuePanel:
    - key: seosiri-rovo-mcp-panel
      title: SEOSiri MCP Context Gateway
      resource: main-ui
      render: native
      icon: https://developers.seosiri.com/favicon.svg
resources:
  - key: main-ui
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/d3ec4edb-3426-4a53-bb3d-1f0650249ccd
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - rovomcp.seosiri.com
        - developers.seosiri.com
        - seosiri.com
        - "*.seosiri.com"
